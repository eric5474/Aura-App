<title>AURA Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: desktop music library. Sidebar | toolbar player over a scrolling view | optional Lyrics / Playing Next panel.
   Phone: bottom tab bar, floating mini player, full-screen Now Playing. */
:root{
  --bg:#f8faf9; --side:#eff3f2; --surface:#ffffff; --raise:#ffffff; --fg:#131a19; --muted:#677372;
  --line:rgba(19,48,46,.11); --hover:rgba(19,70,66,.06); --active:rgba(10,128,122,.13); --zebra:rgba(19,70,66,.035);
  --accent:#0a807a; --accent-fg:#ffffff; --love:#d6336c; --glass:rgba(248,250,249,.82); --lcd:#f1f4f3;
  --menu:rgba(255,255,255,.94); --shadow:0 12px 40px rgba(10,30,30,.18);
  --font-d:'Bricolage Grotesque',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side-w:236px; --panel-w:340px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --side:#171c1b; --surface:#1c2221; --raise:#2a3231; --fg:#ecf2f1; --muted:#93a19f;
  --line:rgba(220,255,250,.09); --hover:rgba(220,255,250,.06); --active:rgba(58,201,190,.16); --zebra:rgba(220,255,250,.03);
  --accent:#3ac9be; --accent-fg:#04201d; --love:#ff5c8a; --glass:rgba(23,28,27,.84); --lcd:#1c2221;
  --menu:rgba(35,42,41,.95); --shadow:0 16px 48px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --side:#171c1b; --surface:#1c2221; --raise:#2a3231; --fg:#ecf2f1; --muted:#93a19f;
  --line:rgba(220,255,250,.09); --hover:rgba(220,255,250,.06); --active:rgba(58,201,190,.16); --zebra:rgba(220,255,250,.03);
  --accent:#3ac9be; --accent-fg:#04201d; --love:#ff5c8a; --glass:rgba(23,28,27,.84); --lcd:#1c2221;
  --menu:rgba(35,42,41,.95); --shadow:0 16px 48px rgba(0,0,0,.5); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:14px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,h5,p{margin:0}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100%}
.app.with-panel{grid-template-columns:var(--side-w) minmax(0,1fr) var(--panel-w)}
.sidebar{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px 12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 2px;font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:-.01em}
.mark{width:34px;height:34px;flex:none;border-radius:23%;display:block;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.lcd-art .mark{width:30px;height:30px}
.phead{display:flex;align-items:flex-end;gap:28px;margin:6px 0 22px;flex-wrap:wrap}
.pavatar{width:min(170px,38vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:750;font-size:clamp(40px,6vw,64px);color:#fff;background:radial-gradient(circle at 30% 25%,#ffb36b,transparent 55%),radial-gradient(circle at 75% 80%,#e0569a,transparent 60%),#3a1530;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-d);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:760px}
.acct-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line)}
.acct-row:last-child{border-bottom:0}
.acct-row > span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:60ch}
.acct-row small{color:var(--muted);font-size:12.5px}
.qpill{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--active);color:var(--accent)}
.qpill.off{background:var(--hover);color:var(--muted)}
.about-logo{width:96px;height:96px;border-radius:23%;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.brand-name{display:flex;flex-direction:column;line-height:1.05;letter-spacing:.14em;font-weight:800}
.brand-name small{font-family:var(--font-b);font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--muted);margin-top:3px}
.tagline{font-family:var(--font-d);font-size:17px;font-weight:600;color:var(--accent);margin:-2px 0 4px;letter-spacing:-.005em}
.side-search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 8px;margin:0 2px}
.side-search .ic{width:16px;height:16px;color:var(--muted)}
.side-search input{border:0;background:none;outline:none;padding:7px 0;width:100%;min-width:0}
.nav-group{display:flex;flex-direction:column;gap:1px}
.nav-group h4{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:7px;border:0;background:none;width:100%;text-align:left;min-width:0}
.nav-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .ic{color:var(--accent)}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--active);font-weight:600}
.nav-item.subtle{color:var(--muted)} .nav-item.subtle .ic{color:var(--muted)}
.nav-item.drop{outline:2px solid var(--accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.account{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 8px;border-radius:8px;text-align:left}
.account:hover{background:var(--hover)}
.account > span:nth-child(2){flex:1;display:flex;flex-direction:column;font-weight:600;min-width:0}
.account small{font-weight:400;color:var(--muted);font-size:12px}
.account .ic{color:var(--muted)}

.main-col{display:flex;flex-direction:column;min-width:0;min-height:0}
.player{height:64px;flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;z-index:5}
.transport,.right-tools{display:flex;align-items:center;gap:2px}
.tbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:0;background:none;color:var(--fg);flex:none;position:relative}
.tbtn:hover{background:var(--hover)}
.tbtn.on{color:var(--accent)}
.tbtn.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.tbtn.big .ic{width:26px;height:26px}
.tbtn.sm{width:28px;height:28px}.tbtn.sm .ic{width:17px;height:17px}
.tbtn.round{border-radius:50%;background:var(--hover);width:38px;height:38px}
.tbtn.loved{color:var(--love)}
.lcd{display:grid;grid-template-columns:52px minmax(0,1fr) 34px;align-items:center;background:var(--lcd);border:1px solid var(--line);border-radius:8px;height:52px;max-width:660px;width:100%;justify-self:center;overflow:hidden}
.lcd-art{width:52px;height:52px;border:0;padding:0;background:none;display:block}
.lcd-art .art{border-radius:0}
.lcd-mid{min-width:0;display:flex;flex-direction:column;align-items:center;padding:4px 8px 0}
.lcd-title{font-weight:600;font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd-sub{font-size:12px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd-sub button{border:0;background:none;padding:0;color:inherit}
.lcd-sub button:hover{color:var(--fg);text-decoration:underline}
.lcd-seek{display:grid;grid-template-columns:34px minmax(0,1fr) 38px;align-items:center;gap:6px;width:100%;font-family:var(--font-m);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.lcd-seek span:last-child{text-align:right}
.lcd-empty{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;justify-content:center;height:100%}
.vol{display:flex;align-items:center;gap:4px;margin-right:4px}
.vol input{width:86px}
input[type=range].rng{-webkit-appearance:none;appearance:none;height:14px;background:none;width:100%;margin:0;cursor:pointer;--p:0%}
input[type=range].rng::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
input[type=range].rng::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--fg);margin-top:-4px;opacity:0;transition:opacity .15s}
input[type=range].rng::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--fg);opacity:0}
input[type=range].rng:hover::-webkit-slider-thumb,input[type=range].rng:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range].rng:hover::-moz-range-thumb{opacity:1}
input[type=range].rng:disabled{cursor:default}

.view{flex:1;overflow-y:auto;min-height:0;padding-block:18px 64px;padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:max(30px,env(safe-area-inset-right,0px))}
.view-inner{max-width:1280px;margin:0 auto}
.viewbar{display:flex;gap:4px;margin:-6px 0 6px -8px}
.page-title{font-family:var(--font-d);font-size:32px;font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:2px 0 4px}
.page-sub{color:var(--muted);margin-bottom:16px;max-width:62ch}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}
.shelf-head h2{font-family:var(--font-d);font-size:21px;font-weight:700;letter-spacing:-.01em}
.shelf-head .sub{color:var(--muted);font-size:13px}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600;text-align:left}
.link:hover{text-decoration:underline}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(140px,15vw,184px);gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;scrollbar-width:thin}
.shelf > *{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:24px 18px}

/* ---------- artwork ---------- */
.art{position:relative;aspect-ratio:1;width:100%;max-width:100%;border-radius:8px;overflow:hidden;container-type:inline-size;isolation:isolate;color:#fff;background:hsl(var(--a) 50% 30%)}
.art .art-by,.art .art-t{position:absolute;left:8cqi;right:8cqi;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.art .art-by{top:7cqi;font-family:var(--font-m);font-size:max(7px,5.4cqi);letter-spacing:.14em;text-transform:uppercase;opacity:.92}
.art .art-t{bottom:7cqi;font-family:var(--font-d);font-weight:750;font-size:max(9px,10.5cqi);line-height:1.02;letter-spacing:-.015em;text-wrap:balance}
.art.mini .art-by,.art.mini .art-t{display:none}
.s-sun{background:repeating-linear-gradient(180deg,transparent 0 5%,hsl(var(--c) 90% 72% / .55) 5% 5.8%) bottom/100% 38% no-repeat,radial-gradient(circle at 50% 62%,hsl(var(--c) 95% 66%) 0 22%,transparent 22.6%),linear-gradient(180deg,hsl(var(--a) 60% 12%),hsl(var(--b) 70% 42%) 62%,hsl(var(--a) 60% 10%) 62%)}
.s-rings{background:repeating-radial-gradient(circle at 28% 72%,hsl(var(--a) 55% 28%) 0 4%,hsl(var(--b) 55% 42%) 4% 8%,hsl(var(--c) 50% 62%) 8% 9.5%,hsl(var(--a) 55% 28%) 9.5% 13%)}
.s-stripes{background:repeating-linear-gradient(-35deg,hsl(var(--a) 70% 48%) 0 9%,hsl(var(--b) 70% 28%) 9% 18%,hsl(var(--c) 65% 82%) 18% 20.5%)}
.s-blob{background:radial-gradient(circle at 25% 30%,hsl(var(--a) 85% 66%),transparent 46%),radial-gradient(circle at 75% 68%,hsl(var(--b) 80% 56%),transparent 50%),radial-gradient(circle at 62% 14%,hsl(var(--c) 80% 72%),transparent 34%),hsl(var(--a) 40% 16%)}
.s-grid{background:radial-gradient(circle,hsl(var(--c) 80% 75%) 0 20%,transparent 22%) 0 0/12.5% 12.5%,linear-gradient(135deg,hsl(var(--a) 65% 36%),hsl(var(--b) 65% 18%))}
.s-split{background:conic-gradient(from 210deg at 36% 64%,hsl(var(--a) 75% 56%) 0 25%,hsl(var(--b) 70% 34%) 0 55%,hsl(var(--c) 70% 74%) 0 70%,hsl(var(--a) 60% 20%) 0)}
.s-type{background:linear-gradient(160deg,hsl(var(--a) 35% 92%),hsl(var(--b) 45% 78%));color:hsl(var(--a) 50% 14%)}
.s-type .art-t{font-size:max(10px,15cqi);text-shadow:none}.s-type .art-by{text-shadow:none}
.s-mix{background:radial-gradient(120% 90% at 0% 0%,hsl(var(--a) 85% 62%),transparent 60%),radial-gradient(110% 90% at 100% 100%,hsl(var(--b) 80% 50%),transparent 60%),hsl(var(--c) 50% 25%)}
.s-mix .art-t{font-size:max(10px,13cqi)}
.s-ed{background:linear-gradient(165deg,hsl(var(--a) 70% 52%),hsl(var(--b) 70% 26%))}
.s-ed .art-t{font-size:max(10px,13cqi)}
.s-ed::before{content:"";position:absolute;inset:auto -20% 38% 30%;height:60%;border-radius:50%;background:hsl(var(--c) 80% 70% / .35);filter:blur(2px);z-index:-1}
.s-user{background:linear-gradient(145deg,hsl(var(--a) 22% 46%),hsl(var(--a) 22% 30%));display:grid;place-items:center}
.s-user .note{width:34%;height:34%;opacity:.8}
.art.coming::after{content:"COMING SOON";position:absolute;top:7cqi;right:7cqi;font-family:var(--font-m);font-size:max(7px,5cqi);letter-spacing:.1em;background:rgba(0,0,0,.4);padding:.3em .5em;border-radius:4px}
.art.mini.coming::after{display:none}
.mosaic{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1;width:100%;max-width:100%;border-radius:8px;overflow:hidden}
.mosaic .art{border-radius:0}
.avatar{aspect-ratio:1;width:100%;max-width:100%;border-radius:50%;display:grid;place-items:center;color:#fff;container-type:inline-size;overflow:hidden;
  background:radial-gradient(circle at 30% 30%,hsl(var(--a) 80% 64%),transparent 55%),radial-gradient(circle at 75% 75%,hsl(var(--b) 75% 50%),transparent 55%),hsl(var(--a) 40% 22%)}
.avatar span{font-family:var(--font-d);font-weight:750;font-size:30cqi;letter-spacing:-.02em;text-shadow:0 2px 16px rgba(0,0,0,.3)}
.art.img img,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.art.img{background:hsl(var(--a,200) 25% 30%)}
.lyr.static p,.lyr.static p:hover{opacity:.95;cursor:default}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.src-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-left:8px}
.bio{white-space:pre-line}
.avatar.sm{width:30px;height:30px}.avatar.sm span{font-size:12px}

/* ---------- tiles & cards ---------- */
.tile{min-width:0;cursor:pointer}
.tile.round{text-align:center}
.cover-wrap{position:relative}
.cover-wrap > .art,.cover-wrap > .mosaic{box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.1)}
.hover-btns{position:absolute;inset:auto 8px 8px 8px;display:flex;justify-content:space-between;opacity:0;transition:opacity .15s}
.tile:hover .hover-btns,.tile:focus-within .hover-btns{opacity:1}
.hb{width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(20,24,24,.62);color:#fff;backdrop-filter:blur(8px)}
.hb.play{background:var(--accent);color:var(--accent-fg)}
.hb .ic{width:17px;height:17px}
.tile-t{font-weight:500;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-s{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:3px;background:var(--muted);color:var(--bg);font-size:9.5px;font-weight:700;margin-left:6px;vertical-align:1px;flex:none}

.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.hero-card:hover{border-color:var(--accent)}
.hero-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 14px 8px}
.hero-art{padding:0 14px}
.hero-art .art{aspect-ratio:16/10}
.hero-cap{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-cap b{font-weight:600;font-size:15px}
.hero-cap span{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:8px;padding:8px 16px;background:var(--hover);font-weight:600;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--active)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:var(--accent)}
.btn.danger{background:#c23a3a;color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn .ic{width:17px;height:17px}

/* ---------- track lists ---------- */
.tracks{display:flex;flex-direction:column}
.thead,.trow{display:grid;grid-template-columns:38px minmax(0,1.4fr) minmax(0,1fr) 30px 52px 30px;gap:10px;align-items:center;padding:4px 6px}
.tracks.noalb .thead,.tracks.noalb .trow{grid-template-columns:38px minmax(0,1fr) 30px 52px 30px}
.thead{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.thead button{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.thead button.on{color:var(--accent)}
.trow{border-radius:6px;cursor:pointer;min-height:48px;border:0;width:100%;background:none;text-align:left}
.tracks.zebra .trow:nth-child(even){background:var(--zebra)}
.trow:hover,.tracks.zebra .trow:hover{background:var(--hover)}
.trow.dis{cursor:default;opacity:.55}
.trow.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.tn{display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.tn .art{width:38px;border-radius:4px}
.tn .pl,.tn .bars{display:none}
.trow:hover:not(.dis) .tn .num,.trow:hover:not(.dis) .tn .art{display:none}
.trow:hover:not(.dis) .tn .pl{display:block;color:var(--fg);width:16px;height:16px}
.trow.now .tn .num,.trow.now .tn .art,.trow.now:hover .tn .pl{display:none}
.trow.now .tn .bars{display:inline-flex}
.trow.now .tt b{color:var(--accent)}
.bars{gap:2px;height:13px;align-items:flex-end}
.bars i{width:3px;height:100%;background:var(--accent);border-radius:1px;animation:eqb .8s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:-.35s}.bars i:nth-child(3){animation-delay:-.6s}
body.paused .bars i{animation-play-state:paused;height:40%}
@keyframes eqb{from{height:25%}to{height:100%}}
.tt{min-width:0;display:flex;flex-direction:column}
.tt b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;min-width:0}
.tt b span{overflow:hidden;text-overflow:ellipsis}
.tt small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sublink{border:0;background:none;padding:0;color:inherit;font:inherit}
.sublink:hover{color:var(--fg);text-decoration:underline}
.ta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.td{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.heart{width:28px;height:28px;border:0;background:none;display:grid;place-items:center;color:var(--muted);opacity:0;border-radius:6px}
.heart .ic{width:16px;height:16px}
.trow:hover .heart,.heart.on{opacity:1}
.heart.on{color:var(--love)}
.trow .more{opacity:0}
.trow:hover .more,.trow .more:focus-visible{opacity:1}
.tfoot{color:var(--muted);font-size:12.5px;margin-top:14px;line-height:1.6}
.top-songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));column-gap:24px}
.top-songs .tracks{display:contents}
.top-songs .trow{grid-template-columns:44px minmax(0,1fr) 30px 52px 30px}

/* ---------- detail headers ---------- */
.dhead{display:grid;grid-template-columns:minmax(150px,260px) minmax(0,1fr);gap:28px;align-items:end;margin:6px 0 24px}
.dinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dinfo h1{font-family:var(--font-d);font-size:clamp(26px,3.4vw,40px);font-weight:750;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.dinfo .by{font-size:19px;font-weight:600;color:var(--accent);border:0;background:none;padding:0;align-self:flex-start}
.dinfo .by:hover{text-decoration:underline}
.dinfo .note{color:var(--muted);max-width:62ch;margin-top:4px}
.dbtns{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.banner-art{position:relative;border-radius:14px;overflow:hidden;margin:4px 0 22px;min-height:220px;display:flex;align-items:flex-end;padding:22px;color:#fff;
  background:radial-gradient(90% 120% at 15% 0%,hsl(var(--a) 80% 60%),transparent 60%),radial-gradient(80% 120% at 90% 100%,hsl(var(--b) 75% 45%),transparent 60%),hsl(var(--a) 40% 16%)}
.banner-art h1{font-family:var(--font-d);font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:-.03em;line-height:.95;text-shadow:0 4px 30px rgba(0,0,0,.3)}
.banner-art .eyebrow{color:rgba(255,255,255,.8);margin-bottom:6px}
.banner-art .dbtns .btn:not(.primary){background:rgba(255,255,255,.18);color:#fff}
.latest{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;max-width:560px;cursor:pointer}
.latest:hover{border-color:var(--accent)}
.latest b{display:block;font-size:16px;margin-top:2px}
.latest p{color:var(--muted);margin-top:2px}
.about{max-width:70ch;color:var(--fg);line-height:1.6}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.facts div{display:flex;flex-direction:column}
.facts span{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ---------- search / radio ---------- */
.page-search{display:none;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:14px}
.page-search input{border:0;outline:none;background:none;padding:11px 0;width:100%;min-width:0;font-size:16px}
.page-search .ic{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.cat{aspect-ratio:16/9;border-radius:10px;border:0;padding:12px 14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(140deg,hsl(var(--a) 62% 50%),hsl(calc(var(--a) + 36) 60% 28%))}
.cat b{font-family:var(--font-d);font-size:19px;font-weight:700;letter-spacing:-.01em}
.cat span{font-size:12.5px;opacity:.88;display:flex;align-items:center;gap:6px}
.cat span .ic{width:15px;height:15px}
.cat:hover{filter:brightness(1.08)}
.top-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tr-card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left;width:100%}
.tr-card:hover{border-color:var(--accent)}
.tr-card > span{min-width:0}
.tr-card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-card small{color:var(--muted)}
.live{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border-radius:14px;overflow:hidden;color:#fff;min-height:250px;
  background:radial-gradient(90% 130% at 0% 0%,hsl(var(--a) 80% 55%),transparent 60%),radial-gradient(90% 120% at 100% 100%,hsl(var(--b) 75% 40%),transparent 60%),hsl(var(--a) 45% 14%)}
.live-main{padding:24px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:11px;letter-spacing:.1em;background:#e5484d;color:#fff;border-radius:4px;padding:3px 7px;align-self:flex-start}
.live-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.live h2{font-family:var(--font-d);font-size:clamp(30px,4vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1}
.live p{opacity:.85}
.live .btn{align-self:flex-start;margin-top:10px;background:#fff;color:#111}
.live-sched{background:rgba(0,0,0,.22);padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.live-sched h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.sched-row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.14)}
.sched-row span:first-child{font-family:var(--font-m);font-size:12px;opacity:.8}
.sched-row b{display:block;font-weight:600}
.sched-row small{opacity:.75}
.empty{padding:40px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:34px;height:34px;color:var(--accent)}
.empty b{color:var(--fg);font-size:16px}
.seg{display:inline-flex;background:var(--hover);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-weight:500;font-size:13px}
.seg button.on{background:var(--raise);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

/* ---------- side panel ---------- */
.panel{border-left:1px solid var(--line);background:var(--side);display:flex;flex-direction:column;min-height:0;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;gap:8px}
.panel-body{overflow-y:auto;padding:6px 16px 30px;flex:1;min-height:0;position:relative}
.panel-body.lyr{padding-top:20vh;padding-bottom:40vh}
.lyr p{font-family:var(--font-d);font-size:var(--lyr,22px);font-weight:700;line-height:1.24;letter-spacing:-.01em;margin:0 0 .75em;opacity:.3;transition:opacity .3s;cursor:pointer}
.lyr p:hover{opacity:.6}
.lyr p.past{opacity:.45}
.lyr p.cur{opacity:1}
.lyr p.gap{letter-spacing:.3em}
.lyr .lyr-msg{font-size:15px;color:var(--muted);cursor:default;opacity:1;font-family:var(--font-b);font-weight:500}
.ph{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.ph-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qtools{display:flex;gap:6px;flex-wrap:wrap}
.qtools .btn.on{background:var(--active);color:var(--accent)}
.qrow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 4px;border-radius:8px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.qrow:hover{background:var(--hover)}
.qrow.cur{background:var(--active)}
.qrow .art{width:38px;border-radius:4px}
.qrow > span{min-width:0;display:flex;flex-direction:column}
.qrow b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tbtn{opacity:0}.qrow:hover .tbtn,.qrow .tbtn:focus-visible{opacity:1}
.auto-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:12px 4px 4px}
.auto-label .ic{width:16px;height:16px;color:var(--accent)}

/* ---------- Now Playing ---------- */
.np{position:fixed;inset:0;z-index:60;color:#f3f7f6;overflow:hidden;isolation:isolate;
  background:radial-gradient(110% 90% at 12% 18%,hsl(var(--a) 60% 38%),transparent 60%),radial-gradient(100% 80% at 90% 92%,hsl(var(--b) 55% 26%),transparent 62%),#0b0f0f;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px;
  padding:max(56px,calc(env(safe-area-inset-top,0px) + 48px)) max(48px,env(safe-area-inset-right,0px)) max(36px,env(safe-area-inset-bottom,0px)) max(48px,env(safe-area-inset-left,0px))}
.np::before{content:"";position:absolute;inset:-20%;z-index:-1;background:radial-gradient(40% 40% at 30% 40%,hsl(var(--c) 70% 50% / .35),transparent 70%),radial-gradient(35% 35% at 70% 60%,hsl(var(--a) 70% 50% / .3),transparent 70%);animation:drift 24s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(6%,-4%) rotate(12deg)}}
.np-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;z-index:2}
.np-left{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;min-width:0;min-height:0}
.np-left .np-art,.np-controls > *{width:min(100%,440px)}
.np-controls{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.np-controls > input.rng{width:min(100%,440px)}
.np-art{box-shadow:0 30px 80px rgba(0,0,0,.5);transition:transform .35s}
body.paused .np-art{transform:scale(.92)}
.np-meta{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px;margin-top:6px}
.np-meta b{display:block;font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta .sublink{color:rgba(243,247,246,.75);font-size:16px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;display:block}
.np .tbtn{color:#fff}
.np .tbtn:hover{background:rgba(255,255,255,.1)}
.np .tbtn.loved{color:#ff6b95}
.np input[type=range].rng::-webkit-slider-runnable-track{background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.22) var(--p));height:4px}
.np input[type=range].rng::-moz-range-track{background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.22) var(--p));height:4px}
.np input[type=range].rng::-webkit-slider-thumb{background:#fff;opacity:1}
.np-times{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:11px;color:rgba(243,247,246,.6);margin-top:-8px;font-variant-numeric:tabular-nums}
.np-ctrls{display:flex;justify-content:space-between;align-items:center}
.np-ctrls .tbtn{width:46px;height:46px}
.np-ctrls .tbtn .ic{width:24px;height:24px}
.np-ctrls .tbtn.main .ic{width:30px;height:30px}
.np-ctrls .tbtn.big{width:64px;height:64px}
.np-ctrls .tbtn.big .ic{width:42px;height:42px}
.np-vol{display:grid;grid-template-columns:20px minmax(0,1fr) 20px;align-items:center;gap:10px;color:rgba(243,247,246,.7)}
.np-vol .ic{width:18px;height:18px}
.np-modes{display:flex;justify-content:center;gap:20px}
.np-modes .tbtn.on{background:rgba(255,255,255,.18)}
.np-modes .tbtn.on::after{display:none}
.np-right{overflow-y:auto;min-height:0;position:relative;padding:22vh 8px 34vh 0;mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent)}
.np-right.lyr p{font-size:calc(var(--lyr,22px)*1.55);color:#fff}
.np-right .lyr-msg{color:rgba(243,247,246,.7)!important;font-size:18px!important}
.np-right.q{padding:10px 8px 40px 0;mask-image:none;-webkit-mask-image:none}
.np-right.q .ph,.np-right.q .qrow small,.np-right.q .auto-label,.np-right.q .muted{color:rgba(243,247,246,.6)}
.np-right.q .qrow:hover{background:rgba(255,255,255,.08)}
.np-right.q .qrow.cur{background:rgba(255,255,255,.14)}
.np-right.q .btn{background:rgba(255,255,255,.12);color:#fff}
.np-right.q .btn.on{background:rgba(255,255,255,.26)}
.np-right.q .link{color:#fff}
.np-mob-only{display:none!important}

/* ---------- overlays ---------- */
.ctx{position:fixed;z-index:90;min-width:230px;max-width:min(300px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow-y:auto;background:var(--menu);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px}
.ctx-head{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;padding:6px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ctx-head .art{width:40px;border-radius:5px}
.ctx-head > span{min-width:0}
.ctx-head b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ctx-head small{color:var(--muted);font-size:12px}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:6px;text-align:left}
.ctx button span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx button .ic{width:16px;height:16px;color:var(--muted)}
.ctx button:hover:not(:disabled),.ctx button:focus-visible{background:var(--accent);color:var(--accent-fg);outline:none}
.ctx button:hover:not(:disabled) .ic,.ctx button:focus-visible .ic{color:var(--accent-fg)}
.ctx button.danger{color:#d23f3f}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.38);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--font-d);font-size:19px;font-weight:700}
.modal-body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:12.5px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.field input:not([type=range]):not([type=checkbox]),.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.switch{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.switch input{accent-color:var(--accent);width:18px;height:18px;margin-top:2px;flex:none}
.switch b{font-weight:600;display:block}.switch small{color:var(--muted)}
.eqs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center}
.eqs label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.eqs output{font-family:var(--font-m);font-size:12px;color:var(--fg)}
.info-head{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
.info-head b{font-family:var(--font-d);font-size:20px;display:block;line-height:1.1}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px}
kbd{font-family:var(--font-m);font-size:11.5px;background:var(--hover);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 6px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
.copybox{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font-family:var(--font-m);font-size:12px}

.tabbar{display:none}
.lib-list .trow{grid-template-columns:30px minmax(0,1fr) 20px;min-height:50px;border-bottom:1px solid var(--line);border-radius:0}
.lib-list .trow > .ic:first-child{color:var(--accent)}
.lib-list .trow b{font-size:17px;font-weight:500}
.lib-list .trow > .ic:last-child{color:var(--muted)}

/* ---------- phone ---------- */
@media (max-width:760px){
  .app,.app.with-panel{grid-template-columns:minmax(0,1fr)}
  .sidebar,.panel{display:none}
  .page-search{display:flex}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:170px}
  .page-title{font-size:30px}
  .player{position:fixed;z-index:30;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(62px + env(safe-area-inset-bottom,0px));height:60px;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);grid-template-columns:minmax(0,1fr) auto;padding:0 6px;gap:4px}
  .lcd{order:-1;border:0;background:none;height:58px;grid-template-columns:46px minmax(0,1fr);max-width:none}
  .lcd-art{width:46px;height:46px}.lcd-art .art{border-radius:7px}
  .lcd-mid{align-items:flex-start;padding:0 6px 0 10px}
  .lcd-seek,.lcd .lcd-more{display:none}
  .lcd-sub button{pointer-events:none}
  .lcd-mid{cursor:pointer}
  .transport .tbtn:not(.t-play):not(.t-next){display:none}
  .right-tools{display:none}
  .tabbar{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;padding:4px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:500;color:var(--muted)}
  .tabbar button.active{color:var(--accent)}
  .tabbar .ic{width:23px;height:23px}
  .dhead{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
  .dhead > .art,.dhead > .mosaic{width:min(250px,70vw)}
  .dinfo{align-items:center}.dinfo .by{align-self:center}.dbtns{justify-content:center}
  .thead,.trow,.tracks.noalb .thead,.tracks.noalb .trow,.top-songs .trow{grid-template-columns:38px minmax(0,1fr) 30px}
  .ta,.td,.heart,.thead .hm{display:none}
  .trow .more{opacity:1}
  .live{grid-template-columns:minmax(0,1fr)}
  .np{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:16px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
  .np-left{display:contents}
  .np-art-wrap{grid-row:1;display:grid;place-items:center;min-height:0}
  .np-art-wrap .art{width:min(78vw,42vh)}

/* ---------- artwork ---------- */
function albumArt(id,cls=''){const a=AL[id];return `<div class="art s-${a.style} ${released(a)?'':'coming'} ${cls}" style="--a:${a.a};--b:${a.b};--c:${a.c}"><span class="art-by">${esc(ARTISTS[a.artist].name)}</span><span class="art-t">${esc(a.title)}</span></div>`}
function avatar(id,cls=''){const a=ARTISTS[id];return `<div class="avatar ${cls}" style="--a:${a.a};--b:${a.b}"><span>${a.name.replace(/^The /,'').split(/[ &]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2)}</span></div>`}
function plArt(p,cls=''){
  if(p.kind==='ed') return `<div class="art s-ed ${cls}" style="--a:${p.hue};--b:${(p.hue+40)%360};--c:${(p.hue+180)%360}"><span class="art-by">${esc(p.cur)}</span><span class="art-t">${esc(p.name)}</span></div>`;
  if(p.kind==='mix') return `<div class="art s-mix ${cls}" style="--a:${p.hue};--b:${(p.hue+60)%360};--c:${(p.hue+200)%360}"><span class="art-by">Made for you</span><span class="art-t">${esc(p.name)}</span></div>`;

 profile(){const p=S.profile,live=!!window.AURA_REMOTE;

 const none=!tr.length&&!al.length&&!ar.length&&!pl.length;
 return `<div class="toolbar"><div class="seg"><button class="${lib?'':'on'}" data-act="scope" data-k="all">AURA</button><button class="${lib?'on':''}" data-act="scope" data-k="lib">Your Library</button></div></div>

  ${tr.length?`<section><div class="shelf-head"><h2>Songs</h2>${lyr.length?`<span class="sub">${lyr.length} matched in lyrics</span>`:''}</div>${trackList(tr.slice(0,10).map(t=>t.id),'Search results',{art:1})}</section>`:''}
  ${shelf('Albums',al.map(a=>albumTile(a.id)))}${shelf('Artists',ar.map(artistTile))}${shelf('Playlists',pl.map(p=>plTile(p)))}`}

function menuItems(key){const [k,id,pl,idx]=key.split(':');
 if(k==='song'){const t=TR[id];if(!t) return [];const ok=playable(t),lv=S.love[id];const self=()=>menuItems(key);
  return {head:`<div class="ctx-head">${albumArt(t.album,'mini')}<span><b>${esc(t.title)}</b><small>${esc(ARTISTS[t.artist].name)}</small></span></div>`,items:[
   {label:'Play Next',icon:'queue',run:()=>playNext([id]),dis:!ok},{label:'Play Last',icon:'list',run:()=>playLast([id]),dis:!ok},{sep:1},

   {sep:1},{label:lv===1?'Unlove':'Love',icon:lv===1?'heartF':'heart',run:()=>love(id)},{label:lv===-1?'Undo Suggest Less':'Suggest Less Like This',icon:'dislike',run:()=>dislike(id)},{sep:1},
   {label:'Create Station',icon:'radio',run:()=>stationFrom(id),dis:!ok},{label:'Go to Album',icon:'album',run:()=>go('album',t.album)},{label:'Go to Artist',icon:'person',run:()=>go('artist',t.artist)},
   {label:'Get Info',icon:'info',run:()=>infoModal(id)},{label:'Share Song…',icon:'share',run:()=>share(`${t.title} by ${ARTISTS[t.artist].name}, from ${AL[t.album].title}. Listening on AURA.`)}]}}
 if(k==='album'){const a=AL[id],ok=released(a);const self=()=>menuItems(key);return [
   {label:'Play',icon:'play',run:()=>playList(a.tracks,0,a.title,{recent:['album',id]}),dis:!ok},{label:'Shuffle',icon:'shuffle',run:()=>playList(a.tracks,0,a.title,{shuffle:1,recent:['album',id]}),dis:!ok},
   {label:'Play Next',icon:'queue',run:()=>playNext(a.tracks),dis:!ok},{label:'Play Last',icon:'list',run:()=>playLast(a.tracks),dis:!ok},{sep:1},
   inLibAlbum(id)?{label:'Remove from Library',icon:'trash',run:()=>libAlbum(id,false)}:{label:ok?'Add to Library':'Pre-Add to Library',icon:'plus',run:()=>libAlbum(id,true)},
   {label:'Add to Playlist',icon:'list',sub:plSub(a.tracks,self),dis:!ok},{sep:1},{label:'Go to Artist',icon:'person',run:()=>go('artist',a.artist)},{label:'Share Album…',icon:'share',run:()=>share(`${a.title} by ${ARTISTS[a.artist].name}. Listening on AURA.`)}]}
 if(k==='artist') return [{label:'Play',icon:'play',run:()=>playArtist(id)},{label:'Shuffle',icon:'shuffle',run:()=>playArtist(id,1)},{label:'Create Station',icon:'radio',run:()=>artistStation(id)},{label:'Share Artist…',icon:'share',run:()=>share(`${ARTISTS[id].name} on AURA`)}];
 if(k==='pl'){const p=plById(id);if(!p) return [];const ids=p.tracks;const it=[{label:'Play',icon:'play',run:()=>playList(ids,0,p.name,{recent:['pl',id]}),dis:!ids.length},{label:'Shuffle',icon:'shuffle',run:()=>playList(ids,0,p.name,{shuffle:1,recent:['pl',id]}),dis:!ids.length},{label:'Play Next',icon:'queue',run:()=>playNext(ids),dis:!ids.length},{label:'Play Last',icon:'list',run:()=>playLast(ids),dis:!ids.length},{sep:1}];
  if(p.kind==='user') it.push({label:'Edit Details…',icon:'edit',run:()=>plModal(S.playlists.find(x=>x.id===id))},{label:'Duplicate',icon:'plus',run:()=>{const n={id:'pl-'+Date.now().toString(36),name:p.name+' Copy',desc:p.desc,tracks:p.tracks.slice(),created:Date.now()};S.playlists.push(n);persist();renderSidebar();toast('Playlist duplicated')}},{sep:1},{label:'Delete Playlist…',icon:'trash',danger:1,run:()=>delPl(id)});
  else if(p.kind==='ed') it.push(S.lib.playlists[id]?{label:'Remove from Library',icon:'trash',run:()=>libPl(id,false)}:{label:'Add to Library',icon:'plus',run:()=>libPl(id,true)},{label:'Share Playlist…',icon:'share',run:()=>share(`${p.name} on AURA`)});
  else it.push({label:'Save as Playlist',icon:'plus',run:()=>{const n={id:'pl-'+Date.now().toString(36),name:p.name,desc:'Saved from '+p.name,tracks:ids.slice(),created:Date.now()};S.playlists.push(n);persist();renderSidebar();toast('Saved to your playlists')}});
  return it}
 if(k==='player'){const t=curTrack();const sl=S.sleep;const left=sl&&sl.until?Math.ceil((sl.until-Date.now())/60000):0;
  return [{label:sl?(sl.end?'Sleep: end of this song':`Sleep timer: ${left} min left`):'Sleep Timer',icon:'moon',sub:()=>[{label:'Back',icon:'back',sub:()=>menuItems('player')},{sep:1},...[['Off',0],['15 minutes',15],['30 minutes',30],['45 minutes',45],['1 hour',60]].map(([l,m])=>({label:l,icon:'clock',run:()=>{S.sleep=m?{until:Date.now()+m*60000}:null;toast(m?`Playback will stop in ${l}`:'Sleep timer off')}})),{label:'End of Current Song',icon:'note',run:()=>{S.sleep={end:true};toast('Playback will stop after this song')},dis:!t}]},
   {label:'Equalizer: '+(S.settings.eqCustom?'Custom':EQ[S.settings.eq][0]),icon:'gear',run:()=>settingsModal('sound')},
   {label:S.settings.autoplay?'Turn Off Autoplay':'Turn On Autoplay',icon:'inf',run:()=>{S.settings.autoplay=!S.settings.autoplay;persist();toast(S.settings.autoplay?'Autoplay on':'Autoplay off');renderPanel()}},
   {sep:1},{label:'Now Playing',icon:'art',run:openFull,dis:!t},{label:'Keyboard Shortcuts',icon:'keys',run:keysModal},{label:'Settings',icon:'gear',run:()=>settingsModal()}]}
 return []}
function openMenu(key,pos){const r=menuItems(key);if(Array.isArray(r)) showMenu(r,pos);else showMenu(r.items,pos,r.head)}
function showMenu(items,pos,headHTML=''){if(!items.length) return;MENU={items,pos,head:headHTML};const el=$('#ctx');
 el.innerHTML=headHTML+items.map((it,i)=>it.sep?'<hr>':`<button role="menuitem" data-mi="${i}" class="${it.danger?'danger':''}" ${it.dis?'disabled':''}>${ic(it.icon)}<span>${esc(it.label)}</span>${it.sub&&it.label!=='Back'?ic('fwd'):''}</button>`).join('');
 el.hidden=false;const w=el.offsetWidth,h=el.offsetHeight;let x=Math.max(8,Math.min(pos.x,innerWidth-w-8)),y=pos.y;if(y+h>innerHeight-8) y=Math.max(8,(pos.top??pos.y)-h-6);
 el.style.left=x+'px';el.style.top=y+'px';const f=el.querySelector('button:not(:disabled)');f&&f.focus({preventScroll:true})}

function openModal(html){$('#modal-root').innerHTML=`<div class="scrim" data-scrim="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#modal-root input:not([type=checkbox]):not([type=range]),#modal-root .btn.primary');f&&f.focus()}

const mhead=t=>`<div class="modal-head"><h3>${t}</h3><button class="tbtn sm" data-act="close-modal" aria-label="Close">${ic('close')}</button></div>`;
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function share(text){try{navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard'),()=>copyFallback(text))}catch(e){copyFallback(text)}}
function copyFallback(text){openModal(mhead('Share')+`<div class="modal-body"><p class="muted">Copy this text to share it.</p><textarea class="copybox" id="copybox" readonly>${esc(text)}</textarea></div>`);const b=$('#copybox');b.focus();b.select()}

/* ---------- library & playlist actions ---------- */
function love(id){if(S.love[id]===1) delete S.love[id];else S.love[id]=1;persist();toast(S.love[id]===1?'Loved':'Removed from loved songs');refresh()}
function dislike(id){if(S.love[id]===-1){delete S.love[id];toast('We’ll suggest this again')}else{S.love[id]=-1;toast('We’ll suggest less like this')}persist();refresh()}
function libSong(id,on){if(on){S.lib.songs[id]=Date.now();toast('Added to Library')}else{delete S.lib.songs[id];const a=TR[id].album;if(inLibAlbum(a)){const tAdd=S.lib.albums[a];delete S.lib.albums[a];AL[a].tracks.filter(t=>t!==id).forEach(t=>S.lib.songs[t]=tAdd)}toast('Removed from Library')}persist();refresh()}
function libAlbum(id,on){if(on===undefined) on=!inLibAlbum(id);if(on){S.lib.albums[id]=Date.now();toast(released(AL[id])?'Added to Library':'Pre-added. It will play on release day.')}else{delete S.lib.albums[id];AL[id].tracks.forEach(t=>delete S.lib.songs[t]);toast('Removed from Library')}persist();refresh()}
function libPl(id,on){if(on===undefined) on=!S.lib.playlists[id];if(on){S.lib.playlists[id]=Date.now();toast('Added to Library')}else{delete S.lib.playlists[id];toast('Removed from Library')}persist();renderSidebar();refresh()}
function addToPl(pid,ids){const p=S.playlists.find(x=>x.id===pid);const add=ids.filter(id=>!p.tracks.includes(id));
 if(!add.length){toast('Already in '+p.name);return}p.tracks.push(...add);persist();renderSidebar();toast(add.length>1?`Added ${add.length} songs to ${p.name}`:'Added to '+p.name);if(cur().name==='playlist'&&cur().id===pid) renderView(true)}
function removeFromPl(pid,i){const p=S.playlists.find(x=>x.id===pid);p.tracks.splice(i,1);persist();renderSidebar();renderView(true);toast('Removed from '+p.name)}
function movePl(pid,i,d){const p=S.playlists.find(x=>x.id===pid),j=i+d;if(j<0||j>=p.tracks.length) return;[p.tracks[i],p.tracks[j]]=[p.tracks[j],p.tracks[i]];persist();renderView(true)}
function playArtist(id,sh){const ids=ALBUMS.filter(a=>a.artist===id&&released(a)).flatMap(a=>a.tracks);playList(ids,0,ARTISTS[id].name,{shuffle:sh,recent:['artist',id]})}
function artistStation(id){const a=ARTISTS[id];S.shuffle=false;const own=shuffleArr(ALL_TRACKS.filter(t=>t.artist===id).map(t=>t.id));const rest=shuffleArr(ALL_TRACKS.filter(t=>t.artist!==id&&(t.genre===a.genre||GEN[t.genre].drums===GEN[a.genre].drums)).map(t=>t.id));
 const ids=[];while(own.length||rest.length){if(own.length) ids.push(own.shift());if(rest.length) ids.push(rest.shift())}playList(ids,0,`${a.name} Station`,{recent:['station',a.genre]})}

function act(n,el,e){const id=el.dataset.id,sh=!!el.dataset.shuffle;
 switch(n){
  case 'back':back();break;case 'toggle':togglePlay();break;case 'next':next();break;case 'prev':prev();break;
  case 'shuffle':toggleShuffle();break;case 'repeat':cycleRepeat();break;
  case 'autoplay':S.settings.autoplay=!S.settings.autoplay;persist();toast(S.settings.autoplay?'Autoplay on':'Autoplay off');renderPanel();renderFull();break;
  case 'mute':if(S.muted||!S.volume){S.muted=false;setVolume(S.volume||.6)}else{S.muted=true;E.setVolume(0);$$('[data-act="mute"]').forEach(b=>b.innerHTML=ic('mute'))}break;
  case 'full':if(isPhone()) S.npMode='art';openFull();break;case 'mfull':if(isPhone()){S.npMode='art';openFull()}break;case 'close-full':closeFull();break;
  case 'npmode':S.npMode=el.dataset.m;renderFull();break;
  case 'panel':if(isPhone()){S.npMode=el.dataset.p==='queue'?'queue':'lyrics';openFull();break}S.panel=S.panel===el.dataset.p?null:el.dataset.p;renderPanel();renderPlayer();break;
  case 'panel-tab':S.panel=el.dataset.p;renderPanel();renderPlayer();break;
  case 'play-album':{const a=AL[id];playList(a.tracks,0,a.title,{shuffle:sh,recent:['album',id]});break}
  case 'play-pl':{const p=plById(id);playList(p.tracks,0,p.name,{shuffle:sh,recent:['pl',id]});break}
  case 'play-artist':playArtist(id,sh);break;
  case 'play-song':{const al=AL[TR[id].album];playList(al.tracks,al.tracks.indexOf(id),al.title,{recent:['album',al.id]});break}
  case 'play-lib':playList(libSongIds().sort((a,b)=>ARTISTS[TR[a].artist].name.localeCompare(ARTISTS[TR[b].artist].name)),0,'Library',{shuffle:sh});break;
  case 'play-station':playStation(id);break;case 'play-live':playLive();break;case 'artist-station':artistStation(id);break;
  case 'love':e.stopPropagation();love(id);break;
  case 'lib-album':libAlbum(id);break;case 'lib-pl':libPl(id);break;
  case 'edit-pl':plModal(S.playlists.find(x=>x.id===id));break;
  case 'qjump':{const i=+el.dataset.i;if(i!==S.qi){S.qi=i;startTrack(0)}break}
  case 'qremove':{e.stopPropagation();const i=+el.dataset.i;S.queue.splice(i,1);if(S.autoFrom>i) S.autoFrom--;renderPanel();renderFull();break}
  case 'qclear':{const end=S.autoFrom>=0?S.autoFrom:S.queue.length;const n=end-S.qi-1;S.queue.splice(S.qi+1,n);if(S.autoFrom>=0) S.autoFrom-=n;renderPanel();renderFull();break}
  case 'hplay':playNext([id],false);next();break;
  case 'lyric-seek':seek(+el.dataset.t);break;
  case 'scope':S.scope=el.dataset.k;updateSearch(S.search);break;
  case 'asort':S.albumSort=el.dataset.k;renderView();break;case 'ssort':S.songSort=el.dataset.k;renderView();break;
  case 'new-pl':plModal(null);break;
  case 'confirm-del':S.playlists=S.playlists.filter(p=>p.id!==id);persist();closeModal();renderSidebar();if(cur().id===id){S.stack=[{name:'playlists'}];renderView()}toast('Playlist deleted');break;
  case 'settings':settingsModal();break;
  case 'edit-profile':profileModal();break;
  case 'aura-signout':signOut();break;
  case 'stab':$$('#modal-root fieldset').forEach(f=>f.hidden=f.dataset.tab!==el.dataset.k);$$('#modal-root [data-act="stab"]').forEach(b=>b.classList.toggle('on',b===el));break;
  case 'theme':S.theme=el.dataset.k;applyTheme();persist();$$('[data-act="theme"]').forEach(b=>b.classList.toggle('on',b===el));break;
  case 'lyric-size':S.settings.lyric=el.dataset.k;applyTheme();persist();$$('[data-act="lyric-size"]').forEach(b=>b.classList.toggle('on',b===el));break;
  case 'sleep':{const m=+el.dataset.m;S.sleep=m?{until:Date.now()+m*60000}:null;toast(m?`Playback will stop in ${m} minutes`:'Sleep timer off');settingsModal('playback');break}
  case 'reset':try{localStorage.removeItem(KEY)}catch(x){}location.reload();break;
  case 'close-modal':closeModal();break;
 }}
document.addEventListener('click',e=>{const t=e.target;
 const mi=t.closest('#ctx [data-mi]');if(mi){const it=MENU.items[+mi.dataset.mi];if(it.sub){const r=it.sub();showMenu(Array.isArray(r)?r:r.items,MENU.pos,Array.isArray(r)?'':r.head)}else{closeMenu();it.run()}return}
 if(!t.closest('#ctx')) closeMenu();
 if(t.dataset&&t.dataset.scrim){closeModal();return}
 const m=t.closest('[data-menu]');if(m){e.stopPropagation();const r=m.getBoundingClientRect();openMenu(m.dataset.menu,{x:r.left,y:r.bottom+4,top:r.top});return}
 const g=t.closest('[data-go],[data-play],[data-act]');if(!g||g.disabled) return;
 if(g.dataset.act){act(g.dataset.act,g,e);return}
 if(g.dataset.play){const [k,i]=g.dataset.play.split(':');const L=LISTS[k];if(L) playList(L.ids,+i,L.label,{recent:L.recent});return}
 closeModal();go(g.dataset.go,g.dataset.id,g.dataset.root)});
document.addEventListener('contextmenu',e=>{const c=e.target.closest('[data-ctx]');if(!c) return;e.preventDefault();openMenu(c.dataset.ctx,{x:e.clientX,y:e.clientY,top:e.clientY})});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='side-q'||t.id==='page-q') updateSearch(t.value);
 else if(t.classList.contains('seek')){dragging=true;const p=+t.value,d=+t.max;t.style.setProperty('--p',p/d*100+'%');$$('[data-el]').forEach(x=>x.textContent=fmt(p));$$('[data-rem]').forEach(x=>x.textContent='-'+fmt(d-p))}
 else if(t.classList.contains('vol-rng')) setVolume(+t.value);
 else if(t.classList.contains('eqr')){const g=$$('.eqr').map(r=>+r.value);S.settings.eqCustom=g;t.style.setProperty('--p',(+t.value+12)/24*100+'%');t.nextElementSibling.textContent=(t.value>0?'+':'')+t.value+' dB';applySound();persist()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.classList.contains('seek')){dragging=false;seek(+t.value)}
 else if(t.id==='st-auto'){S.settings.autoplay=t.checked;persist()}
 else if(t.id==='st-sc'){S.settings.soundCheck=t.checked;applySound();persist()}
 else if(t.id==='st-eq'&&t.value!=='custom'){S.settings.eq=t.value;S.settings.eqCustom=null;applySound();persist();settingsModal('sound')}});
document.addEventListener('keydown',e=>{const t=e.target,typing=/INPUT|TEXTAREA|SELECT/.test(t.tagName)&&t.type!=='range'&&t.type!=='checkbox';
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(isPhone()) go('search',undefined,true);else{const s=$('#side-q');s.focus();s.select()}return}
 if(e.key==='Escape'){if(!$('#ctx').hidden) closeMenu();else if($('#modal-root').innerHTML) closeModal();else if(!$('#np').hidden) closeFull();else if(S.panel){S.panel=null;renderPanel();renderPlayer()}return}
 if(typing||t.type==='range') return;
 const mod=e.metaKey||e.ctrlKey;
 if(e.key===' '&&!/BUTTON/.test(t.tagName)){e.preventDefault();togglePlay();return}
 if(e.key==='ArrowRight'){e.preventDefault();mod?next():seek(S.pos+10);return}
 if(e.key==='ArrowLeft'){e.preventDefault();mod?prev():seek(S.pos-10);return}
 if(mod&&e.key==='ArrowUp'){e.preventDefault();setVolume(Math.min(1,S.volume+.1));return}
 if(mod&&e.key==='ArrowDown'){e.preventDefault();setVolume(Math.max(0,S.volume-.1));return}
 if(mod||e.altKey) return;
 const k=e.key.toLowerCase();
 if(k==='s'){toggleShuffle();return}if(k==='r'){cycleRepeat();return}if(k==='f'){$('#np').hidden?openFull():closeFull();return}
 if(k==='l'||k==='q'){const p=k==='l'?'lyrics':'queue';if(!$('#np').hidden){S.npMode=p;renderFull();return}if(isPhone()) return;S.panel=S.panel===p?null:p;renderPanel();renderPlayer();return}
 if(e.key==='Enter'&&t.matches('[tabindex="0"]')) t.click()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='profile-form'){const n=$('#pf-name').value.trim();if(n){S.profile.name=n.slice(0,40);if(A.acct){A.acct.name=S.profile.name;store(AKEY,A.acct)}persist();renderSidebar();renderView(true);toast('Profile updated')}closeModal();return}
 if(f.id!=='pl-form') return;
 const name=$('#pl-name').value.trim()||'Untitled Playlist',desc=$('#pl-desc').value.trim();
 if(f.dataset.id){const p=S.playlists.find(x=>x.id===f.dataset.id);p.name=name;p.desc=desc;persist();closeModal();renderSidebar();renderView(true);toast('Playlist updated');return}
 const ids=f.dataset.ids?f.dataset.ids.split(','):[];const p={id:'pl-'+Date.now().toString(36),name,desc,tracks:ids,created:Date.now()};S.playlists.push(p);persist();closeModal();renderSidebar();go('playlist',p.id,true);toast(ids.length?`Created “${name}” with ${songs(ids.length)}`:`Created “${name}”`)});

/* ---------- AURA account (kept on this device) ---------- */
const AKEY='aura-account-v1',SKEY='aura-session-v1';
const A={acct:null,tab:'in',err:''};
try{A.acct=JSON.parse(localStorage.getItem(AKEY)||'null')}catch(e){}
const store=(k,v,keep=true)=>{try{const st=keep?localStorage:sessionStorage;v==null?(localStorage.removeItem(k),sessionStorage.removeItem(k)):st.setItem(k,JSON.stringify(v))}catch(e){}};
const readStore=k=>{try{return JSON.parse(sessionStorage.getItem(k)||localStorage.getItem(k)||'null')}catch(e){return null}};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
// Passwords are never stored: only a salted PBKDF2-SHA-256 hash (or a slow SHA-256 chain where the browser lacks it).
function sha256js(str){const K=[],H=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};while(c<64){if(isP(n)){if(c<8)H[c]=(Math.pow(n,1/2)*2**32)|0;K[c]=(Math.pow(n,1/3)*2**32)|0;c++}n++}
 const b=unescape(encodeURIComponent(str)),w=[],l=b.length*8;for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);w[l>>5]|=0x80<<(24-l%32);w[((l+64>>9)<<4)+15]=l;
 const h=H.slice();for(let j=0;j<w.length;j+=16){const W=[];let [a,bb,cc,d,e,f,g,hh]=h;for(let i=0;i<64;i++){if(i<16)W[i]=w[j+i]|0;else{const x=W[i-15],y=W[i-2];W[i]=((((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3))+W[i-16]+(((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10))+W[i-7])|0}
  const t1=(hh+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&bb)^(a&cc)^(bb&cc)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
  h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+cc)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}
 return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
async function passHash(pw,salt,alg){
 if(alg!=='sha-chain'&&window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return {alg:'pbkdf2',hash:hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))}}
 let h=salt+pw;for(let i=0;i<4000;i++) h=sha256js(h+salt);return {alg:'sha-chain',hash:h}}
const newSalt=()=>{try{return hex(crypto.getRandomValues(new Uint8Array(16)))}catch(e){return Math.random().toString(36).slice(2)+Date.now().toString(36)}};
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

   <p class="auth-err" role="alert">${esc(A.err)}</p>
   <button class="btn primary" type="submit">Create Account</button></form>`);
 const reset=A.tab==='reset'?`<div class="auth-panel"><b>Reset AURA on this device?</b><p class="auth-note" style="text-align:left">This removes the AURA account for ${esc(A.acct?A.acct.email:'')} from this device so you can create a new one. Your library, playlists and listening history stay.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-auth="in">Cancel</button><button class="btn primary" data-auth="reset-yes">Reset</button></div></div>`:'';
 return `<div class="auth-card"><div class="auth-brand"><img src="${LOGO}" alt=""><h1>AURA</h1><p>Listen to your heart’s desire</p></div>
  ${reset||`<div class="auth-panel"><div class="auth-tabs" role="tablist"><button role="tab" data-auth="in" aria-selected="${inTab}">Sign In</button><button role="tab" data-auth="up" aria-selected="${!inTab}">Create Account</button></div>${form}</div>`}
  <p class="auth-note">Your AURA account is kept on this device only.</p></div>`}
function showAuth(){const el=$('#auth');el.innerHTML=authHTML();el.hidden=false;const f=el.querySelector('input:not([type=checkbox]):not([value]),input#au-pass');f&&f.focus()}
function hideAuth(){const el=$('#auth');el.hidden=true;el.innerHTML='';A.err=''}
function authErr(m){A.err=m;const e=$('#auth .auth-err');if(e) e.textContent=m;else showAuth()}
function afterSignIn(){S.profile.name=A.acct.name;persist();hideAuth();renderSidebar();renderView(true);toast(`Welcome, ${A.acct.name.split(' ')[0]}`)}
function signOut(){store(SKEY,null);A.tab='in';closeModal();showAuth()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-auth]');if(!b) return;const k=b.dataset.auth;
 if(k==='reset-yes'){store(AKEY,null);store(SKEY,null);A.acct=null;A.tab='up';A.err='';showAuth();return}
 A.tab=k;A.err='';showAuth()});
document.addEventListener('submit',async e=>{const f=e.target;if(f.id!=='auth-in'&&f.id!=='auth-up') return;e.preventDefault();e.stopImmediatePropagation();
 const btn=f.querySelector('button[type=submit]');const email=$('#au-email').value.trim().toLowerCase(),pw=$('#au-pass').value;
 if(f.id==='auth-up'){const name=$('#au-name').value.trim();
  if(!name) return authErr('Enter your name.');if(!validEmail(email)) return authErr('Enter a valid email address.');
  if(pw.length<8) return authErr('Use at least 8 characters for your password.');if(pw!==$('#au-pass2').value) return authErr('The passwords don’t match.');
  btn.disabled=true;const salt=newSalt(),h=await passHash(pw,salt);
  A.acct={name:name.slice(0,40),email,salt,alg:h.alg,hash:h.hash,created:Date.now()};store(AKEY,A.acct);store(SKEY,{email,at:Date.now()});afterSignIn();return}
 if(!A.acct||email!==A.acct.email) return authErr('No AURA account with that email on this device.');
 btn.disabled=true;const h=await passHash(pw,A.acct.salt,A.acct.alg);btn.disabled=false;
 if(h.hash!==A.acct.hash){$('#au-pass').value='';return authErr('Wrong password. Try again.')}
 store(SKEY,{email,at:Date.now()},$('#au-keep').checked);afterSignIn()},true);
/* boot */
function qualityRow(){return `<div class="acct-row"><span><b>Streaming quality</b><small>Standard quality</small></span><span class="qpill">128 kbps</span></div>`}
function extraAccountRows(){return ''}
function bootDemo(){if(window.__booted) return;window.__booted=1;applyTheme();renderSidebar();renderPlayer();renderPanel();renderView();document.body.classList.add('paused')}
/* When AURA is served by its own backend (on this computer or your network), load the live-catalogue adapter. */
if(window.AURA_SERVER||/^(localhost|127\.|\[::1\]|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)||location.hostname.endsWith('.local')){
 const rs=document.createElement('script');rs.src='remote.js';rs.onerror=bootDemo;rs.onload=()=>{if(!window.AURA_REMOTE) bootDemo()};document.head.appendChild(rs);setTimeout(bootDemo,4000);
}else bootDemo();
if(!signedIn()){A.tab=A.acct?'in':'up';showAuth()}
</script>
