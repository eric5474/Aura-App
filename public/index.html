<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA - Functional Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="auraApp()" :style="--theme-primary: ${themeColor}" class="bg-darkBg text-zinc-100">

    <script>
        function auraApp() {
            return {
                isLoggedIn: true, // Set to true for testing
                currentTrack: null,
                isPlaying: false,
                isLoading: false,
                currentTime: 0,
                duration: 0,
                progress: 0,
                audioPlayer: new Audio(),
                themeColor: '#FF6B00',
                tracks: [
                    { id: '1', title: 'Test Audio', artist: 'System', coverUrl: 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300', streamUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' }
                ],

                init() {
                    this.audioPlayer.addEventListener('timeupdate', () => {
                        this.currentTime = this.audioPlayer.currentTime;
                        this.duration = this.audioPlayer.duration || 0;
                        this.progress = (this.currentTime / this.duration) * 100 || 0;
                    });

                    this.audioPlayer.addEventListener('play', () => { this.isPlaying = true; });
                    this.audioPlayer.addEventListener('pause', () => { this.isPlaying = false; });
                    this.audioPlayer.addEventListener('ended', () => { this.isPlaying = false; });
                    this.audioPlayer.addEventListener('error', (e) => {
                        console.error("Audio Error:", e);
                        this.isLoading = false;
                        alert("Error loading audio stream.");
                    });
                },

                async play(track) {
                    if (this.currentTrack && this.currentTrack.id === track.id) {
                        return this.togglePlay();
                    }

                    this.currentTrack = track;
                    this.isLoading = true;

                    // 1. Logic for fetching stream (Replace with your API call)
                    // For testing, we use the hardcoded streamUrl in the object
                    const streamUrl = track.streamUrl; 

                    this.audioPlayer.src = streamUrl;
                    this.audioPlayer.load();

                    try {
                        await this.audioPlayer.play();
                        this.isLoading = false;
                    } catch (err) {
                        console.error("Playback failed:", err);
                        this.isLoading = false;
                        // Attempt a user-triggered play if autoplay is blocked
                        alert("Click to start playback");
                    }
                },

                togglePlay() {
                    if (this.audioPlayer.paused) {
                        this.audioPlayer.play().catch(e => console.log(e));
                    } else {
                        this.audioPlayer.pause();
                    }
                },

                formatTime(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = Math.floor(seconds % 60);
                    return ${m}:${s < 10 ? '0' : ''}${s};
                }
            }
        }
    </script>

    <!-- UI Implementation -->
    <div class="p-10">
        <template x-for="track in tracks" :key="track.id">
            <button @click="play(track)" class="bg-primary p-4 rounded-xl text-white">
                Play <span x-text="track.title"></span>
            </button>
        </template>

        <div class="mt-10 p-6 bg-zinc-900 rounded-2xl" x-show="currentTrack">
            <h2 x-text="currentTrack?.title"></h2>
            <div class="w-full bg-zinc-700 h-2 mt-4">
                <div class="bg-primary h-2" :style="width: ${progress}%"></div>
            </div>
            <button @click="togglePlay()" x-text="isPlaying ? 'Pause' : 'Play'" class="mt-4 border p-2"></button>
        </div>
    </div>
</body>
</html>
