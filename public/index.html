<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURA - Listen to your heart and mood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#FF6B00', darkBg: '#09090b' } } } }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #09090b; color: #f4f4f5; margin: 0; overflow-x: hidden; }
        .glass-panel { background: rgba(18, 18, 20, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .apple-mini-player { background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(30px); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        input[type="range"] { accent-color: var(--theme-primary, #FF6B00); }
        .mini-seek { height: 2px; width: 100%; position: absolute; bottom: 0; left: 0; margin: 0; border-radius: 0 0 14px 14px; }
    </style>
</head>
<body x-data="auraApp()">

    <!-- HTML5 AUDIO ENGINE -->
    <audio x-ref="audioEl" 
           @timeupdate="currentTime = $refs.audioEl.currentTime; duration =$refs.audioEl.duration || 100" 
           @ended="nextTrack()">
    </audio>

    <div class="fixed inset-0 bg-cover bg-center filter blur-3xl opacity-30 pointer-events-none scale-125 z-0 transition-all duration-700" :style="`background-image: url('${bgBlurImage}')`"></div>
    <div class="fixed inset-0 bg-darkBg/85 pointer-events-none z-0"></div>

    <template x-if="!isLoggedIn">
        <div class="relative min-h-screen flex items-center justify-center p-6 z-10">
            <div class="w-full max-w-md glass-panel p-8 rounded-3xl text-center">
                <h1 class="text-3xl font-bold text-white mb-6">AURA</h1>
                <form @submit.prevent="login" class="space-y-4">
                    <input type="text" x-model="authEmail" placeholder="Email or admin" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primary" />
                    <input type="password" x-model="authPass" placeholder="Password" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primary" />
                    <button type="submit" class="w-full py-3 rounded-xl bg-primary text-white font-bold" x-text="isRegistering ? 'Sign Up' : 'Log In'"></button>
                    <button type="button" @click="isRegistering = !isRegistering" class="text-xs text-zinc-400 hover:text-white" x-text="isRegistering ? 'Already have an account? Log In' : 'Don\\'t have an account? Sign up'"></button>
                </form>
            </div>
        </div>
    </template>

    <template x-if="isLoggedIn">
        <div class="relative min-h-screen pb-32 text-zinc-100 flex flex-col z-10">
            <header class="flex items-center justify-between px-6 py-4 glass-panel sticky top-0 z-30 border-b border-zinc-800">
                <span class="font-bold text-xl text-white">AURA</span>
                <button @click="currentTab = 'profile'" class="w-8 h-8 rounded-full border border-zinc-700 overflow-hidden">
                    <img :src="profilePicUrl" class="w-full h-full object-cover" />
                </button>
            </header>

            <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 overflow-y-auto">
                <h2 class="text-2xl font-bold mb-4" x-text="`Made For You, ${authEmail}`"></h2>
                <div class="grid grid-cols-2 gap-4">
                    <template x-for="track in tracks" :key="track.id">
                        <div @click="playTrack(track)" class="bg-zinc-900/60 p-3 rounded-xl border border-zinc-800 hover:bg-zinc-800 cursor-pointer transition">
                            <img :src="track.coverUrl" class="w-full aspect-square rounded-md object-cover mb-2" />
                            <h4 class="font-semibold text-sm text-white truncate" x-text="track.title"></h4>
                            <p class="text-xs text-zinc-400 truncate" x-text="track.artist"></p>
                        </div>
                    </template>
                </div>
            </main>

            <!-- APPLE MUSIC STYLE MINI PLAYER -->
            <template x-if="currentTrack && !isFullPlayerOpen">
                <div class="fixed bottom-6 left-2 right-2 sm:max-w-md sm:mx-auto apple-mini-player z-40 relative cursor-pointer" @click="isFullPlayerOpen = true">
                    <div class="flex items-center justify-between p-2 pb-3">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <img :src="currentTrack.coverUrl" class="w-12 h-12 rounded-lg object-cover shadow-md" />
                            <div class="truncate">
                                <h4 class="font-semibold text-sm text-white truncate" x-text="currentTrack.title"></h4>
                                <p class="text-xs text-zinc-400 truncate" x-text="currentTrack.artist"></p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4 pr-3">
                            <button @click.stop="prevTrack()" class="text-white text-xl hover:text-primary transition">⏮</button>
                            <button @click.stop="togglePlay()" class="text-white text-2xl font-bold hover:scale-110 transition" x-text="isPlaying ? '⏸' : '▶'"></button>
                            <button @click.stop="nextTrack()" class="text-white text-xl hover:text-primary transition">⏭</button>
                        </div>
                    </div>
                    <!-- Mini Player Seek Bar -->
                    <input type="range" min="0" :max="duration || 100" x-model="currentTime" @input="$refs.audioEl.currentTime = currentTime" @click.stop class="mini-seek appearance-none cursor-pointer bg-zinc-700" />
                </div>
            </template>

            <!-- FULL SCREEN PLAYER OVERLAY -->
            <template x-if="isFullPlayerOpen && currentTrack">
                <div class="fixed inset-0 z-50 flex flex-col justify-between p-6 sm:p-12 overflow-hidden bg-darkBg/95 backdrop-blur-3xl animate-fadeIn">
                    <div class="absolute inset-0 bg-cover bg-center filter blur-3xl opacity-50 scale-125" :style="`background-image: url('${currentTrack.coverUrl}')`"></div>
                    
                    <div class="relative z-10 flex items-center justify-between">
                        <button @click="isFullPlayerOpen = false" class="w-10 h-10 rounded-full bg-white/10 text-white flex items-center justify-center border border-white/20">↓</button>
                        <span class="text-xs font-semibold uppercase tracking-widest text-primary">Now Playing</span>
                        <div class="w-10"></div>
                    </div>

                    <div class="relative z-10 my-auto max-w-sm mx-auto w-full space-y-6 text-center">
                        <img :src="currentTrack.coverUrl" class="w-full aspect-square rounded-3xl object-cover shadow-2xl" />
                        <div class="text-left px-1">
                            <h2 class="text-2xl font-bold text-white" x-text="currentTrack.title"></h2>
                            <p class="text-base text-zinc-300" x-text="currentTrack.artist"></p>
                        </div>
                        <div class="space-y-2">
                            <input type="range" min="0" :max="duration || 100" x-model="currentTime" @input="$refs.audioEl.currentTime = currentTime" class="w-full h-1.5 bg-white/20 rounded-lg appearance-none cursor-pointer" />
                            <div class="flex justify-between text-xs text-zinc-400 font-medium">
                                <span x-text="formatTime(currentTime)"></span>
                                <span x-text="formatTime(duration)"></span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between px-4 pt-4">
                            <button @click="prevTrack()" class="text-white text-3xl hover:text-primary">⏮</button>
                            <button @click="togglePlay()" class="w-20 h-20 rounded-full bg-white text-black flex items-center justify-center text-3xl font-bold shadow-xl" x-text="isPlaying ? '⏸' : '▶'"></button>
                            <button @click="nextTrack()" class="text-white text-3xl hover:text-primary">⏭</button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <script>
        function auraApp() {
            return {
                isLoggedIn: false,
                isRegistering: false,
                authEmail: 'admin',
                authPass: 'admin',
                token: null,
                currentTab: 'home',
                currentTrack: null,
                isPlaying: false,
                isFullPlayerOpen: false,
                currentTime: 0,
                duration: 100,
                
                bgBlurImage: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1000&auto=format&fit=crop&q=80',
                profilePicUrl: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80',

                tracks: [
                    { id: '1', title: 'Starboy', artist: 'The Weeknd', coverUrl: 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&auto=format&fit=crop&q=80' },
                    { id: '2', title: 'Midnight City', artist: 'M83', coverUrl: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80' },
                    { id: '3', title: 'Resonance', artist: 'HOME', coverUrl: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300&auto=format&fit=crop&q=80' },
                    { id: '4', title: 'Blinding Lights', artist: 'The Weeknd', coverUrl: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop&q=80' }
                ],

                async login() {
                    const endpoint = this.isRegistering ? '/api/auth/signup' : '/api/auth/login';
                    const res = await fetch(endpoint, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: this.authEmail, password: this.authPass })
                    });
                    const data = await res.json();
                    if(data.success) {
                        this.token = data.token;
                        this.isLoggedIn = true;
                    } else { alert(data.error || 'Authentication Failed'); }
                },

                async playTrack(track) {
                    this.currentTrack = track;
                    const res = await fetch(`/api/resolve-stream?title=${encodeURIComponent(track.title)}&artist=${encodeURIComponent(track.artist)}`);
                    const data = await res.json();
                    
                    if(data.success) {
                        const audioEl = this.$refs.audioEl;
                        audioEl.src = data.streamUrl;
                        audioEl.play().then(() => { this.isPlaying = true; }).catch(e => console.error(e));
                    }
                },

                togglePlay() {
                    if (!this.currentTrack) return;
                    const audioEl = this.$refs.audioEl;
                    if (this.isPlaying) { audioEl.pause(); this.isPlaying = false; } 
                    else { audioEl.play(); this.isPlaying = true; }
                },

                nextTrack() {
                    if (!this.currentTrack) return;
                    let idx = this.tracks.findIndex(t => t.id === this.currentTrack.id);
                    this.playTrack(this.tracks[(idx + 1) % this.tracks.length]);
                },

                prevTrack() {
                    if (!this.currentTrack) return;
                    let idx = this.tracks.findIndex(t => t.id === this.currentTrack.id);
                    this.playTrack(this.tracks[(idx - 1 + this.tracks.length) % this.tracks.length]);
                },

                formatTime(seconds) {
                    if (isNaN(seconds) || seconds < 0) return "0:00";
                    let m = Math.floor(seconds / 60);
                    let s = Math.floor(seconds % 60);
                    return m + ":" + (s < 10 ? "0" : "") + s;
                }
            }
        }
    </script>
</body>
</html>
