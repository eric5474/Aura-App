<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA - Desktop Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { 
                        primary: '#FA243C', /* Apple Music Red/Pink Accent */
                        darkBg: '#3E2412', /* Matching the rich brown background from the image */
                        cardBg: '#18181b' 
                    } 
                } 
            } 
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--theme-bg, #3E2412); 
            color: #f4f4f5; 
            margin: 0; 
            overflow: hidden; 
            transition: background-color 0.5s ease;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        
        .floating-player {
            background: rgba(40, 40, 40, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .sidebar-item:hover, .sidebar-item.active {
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
        }
        .sidebar-item.active { color: white; font-weight: 500; }
        .sidebar-item.active svg { color: var(--theme-primary, #FA243C); }
        
        .track-row:hover { background: rgba(255,255,255,0.08); }
        input[type="range"] { accent-color: #FA243C; }
    </style>
</head>
<body x-data="auraApp()">

    <!-- HTML5 AUDIO ENGINE -->
    <audio x-ref="audioEl" 
           @timeupdate="currentTime = $refs.audioEl.currentTime; duration =$refs.audioEl.duration || 100" 
           @ended="nextTrack()">
    </audio>
